<head>

<body>
    <script>
        let nombre=prompt("¿Cual es tu nombre?");
        let edad=prompt("¿Cual es tu edad?");

        let direccion=prompt("Escribe tu direccion");

        alert("Tu nombre es: " + nombre + "\nTu especialidad es: "
                + especialidad + "\nTienes: " + edad + " años" + 
                "\nTu direccion es: " + direccion
            );

    </script>
</body>
