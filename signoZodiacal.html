<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let fecha=(prompt("Ingresa tu fecha de nacimiento (DD/MM/AA):"));
        let datos=fecha.split("/");
        let dia=parseInt(datos[0]);
        let mes=parseInt(datos[1]);
        let signo= "";
        switch(mes){
            case 1:
                signo=dia <= 19 ? "Capricornio" : "Acuario";
                break;
            case 2:
                signo=dia <= 18 ? "Acuario" : "Piscis";
                break;
            case 3:
                signo=dia <= 20 ? "Piscis" : "Aries";
                break;
            case 4:
                signo=dia <= 19 ? "Aries" : "Tauro";
                break;
            case 5:
                signo=dia <= 20 ? "Tauro" : "Géminis";
                break;
            case 6:
                signo=dia <= 20 ? "Géminis" : "Cáncer";
                break;
            case 7:
                signo=dia <= 22 ? "Cáncer" : "Leo";
                break;
            case 8:
                signo=dia <= 22 ? "Leo" : "Virgo";
                break;
            case 9:
                signo=dia <= 22 ? "Virgo" : "Libra";
                break;
            case 10:
                signo=dia <= 22 ? "Libra" : "Escorpio";
                break;
            case 11:
                signo=dia <= 21 ? "Escorpio" : "Sagitario";
                break;
            case 12:
                signo=dia <= 21 ? "Sagitario":"Capricornio";
                break;
            default:
                signo="Fecha no válida";
        }
        alert("Tu signo zodiacal es: " + signo);
    </script>
</body>
</html>
