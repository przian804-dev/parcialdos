<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let N1=Number(prompt('Introduce el primer numero'));
        let N2=Number(prompt('Introduce el segundo numero'));
        suma=N1+N2;
        resta=N1-N2;
        multi=N1*N2;
        division=N1/N2;
        alert("La suma es: " + suma + 
            "\nLa resta es: " + resta + 
            "\nLa multiplicacion es: " + multi +
            "\nLa division es: " + division 
        );
    </script>
</body>
</html>
