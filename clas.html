<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <p id="prueba"></p>
   <br>
   <p id="ejemplo"></p>
   <br>
   <p id="texto">Soy bien listo</p>
   <br>
   <p id="textos">Soy bien chingon</p>
   <script>
    let elemento=document.getElementById("prueba");
    elemento.innerHTML="Aprendiendo metodos de javaScript";
    
    var prueba=document.getElementById("ejemplo");
    prueba.innerHTML="Soy bien flojo";

    let texto=document.querySelector("#texto");
    texto.style.color="green";

    let text=document.querySelector("#textos");
    text.style.color="blue";
   </script>
</body>
</html>
